[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-freelancer-os"
version = "0.1.0"
description = "Headless FastAPI backend for the AI Freelancer Operating System MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    "fastapi>=0.116,<0.117",
    "httpx>=0.28,<0.29",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<0.1",
    "pydantic-settings>=2.10,<2.11",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.35,<0.36",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
arq = ["arq>=0.26,<0.27"]
postgres = ["psycopg[binary]>=3.2,<4"]
metrics = ["prometheus-client>=0.21,<0.22"]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.6,<0.9",
    "mypy>=1.11,<2",
    "arq>=0.26,<0.27",
    "prometheus-client>=0.21,<0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines handled by formatter; B008: FastAPI Depends/Header/Form defaults are idiomatic.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Helper scripts adjust sys.path before importing the app package.
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["alembic/"]
