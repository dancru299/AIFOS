[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-freelancer-os"
version = "0.1.0"
description = "Headless FastAPI backend for the AI Freelancer Operating System MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    "fastapi>=0.116,<0.117",
    "httpx>=0.28,<0.29",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<0.1",
    "pydantic-settings>=2.10,<2.11",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
